name: commit-heartbeat

# Dead-man's switch for the public development record. If no commit has landed
# in the last STALE_DAYS days the run fails and GitHub emails the repository
# owner — a nudge that the project has gone quiet, not a pass/fail on the code.
# It never commits anything itself; self-committing would defeat the purpose.
#
# The threshold is deliberately loose. It used to be a week, back when a
# scheduled workflow pushed a queued change every few days; that drip has been
# retired in favour of ordinary development, which is lumpier by nature.

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily (~11:00 KST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    env:
      STALE_DAYS: "30"    # natural development pace; the drip that forced a commit every <7d is retired
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail (and email owner) if no recent commit
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit: $(git log -1 --format='%ci  %s')"
          echo "Age: ${age_days} day(s); threshold: ${STALE_DAYS} day(s)."
          if [ "$age_days" -gt "${STALE_DAYS}" ]; then
            echo "::error::No commit in ${age_days} days. Nothing is broken — this is a reminder that the repository has gone quiet. Note GitHub disables scheduled workflows after 60 days of no repo activity, which would silence this check too."
            exit 1
          fi
          echo "OK — commit history is active."

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # A healthy job takes 4 to 8 minutes. Without a cap, a hung step burns
    # GitHub's 6-hour default and holds the PR unmergeable for all of it (#21).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system audio deps (Linux)
        if: runner.os == 'Linux'
        # This is the step that hung on #3, #14, #26 and #27: apt-get waits on a
        # mirror or the dpkg lock indefinitely. Bound the wait, retry the update,
        # and fail the step fast so a re-run can clear it.
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends libsndfile1 ffmpeg

      - name: Install DEBUSSY + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run pytest with coverage
        run: |
          pytest --cov=debussy --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

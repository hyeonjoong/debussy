name: publish

# Publish to PyPI when a version tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC): PyPI verifies the workflow identity
# directly, so there is no API token to store as a repository secret and nothing
# to rotate. This requires a one-time setup on PyPI — see below.
#
# One-time setup (PyPI -> Your projects -> Publishing -> Add a pending publisher):
#   PyPI Project Name: debussy-audio
#   Owner:             hyeonjoong
#   Repository name:   debussy
#   Workflow name:     publish.yml
#   Environment name:  pypi
#
# Release procedure:
#   1. bump the version in pyproject.toml and src/debussy/__init__.py
#   2. update CHANGELOG.md
#   3. git tag -a vX.Y.Z -m "DEBUSSY vX.Y.Z" && git push origin vX.Y.Z
#
# The tag must match the version in pyproject.toml; the build job checks this and
# fails the run rather than publishing a mislabelled distribution.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag  pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match pyproject version $pkg — refusing to publish."
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata and long description
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    # Manual dry run: publish to TestPyPI to rehearse before the real thing.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/debussy-audio
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/debussy-audio
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
